overrides:
  uuid: '14.0.0'
  tmp: '0.2.7'
  deepmerge-ts: '8.0.2'

engineStrict: true
#  Only packages released at least 15 days ago can be installed
minimumReleaseAge: 21600
# Install fails if a package's trust level has decreased compared to previous releases
trustPolicy: no-downgrade
# To preserve older versions, after 6 months of package age the trust policy is removed
trustPolicyIgnoreAfter: 432000
allowBuilds:
  '@gouvfr/dsfr': false
  '@parcel/watcher': false
  '@prisma/client': false
  '@prisma/engines': false
  esbuild: false
  prisma: false
  unrs-resolver: false
shamefullyHoist: true
minimumReleaseAgeExclude:
  - '@nuxt/devtools-kit@3.4.4'
  - '@nuxt/devtools-wizard@3.4.4'
  - '@nuxt/devtools@3.4.4'
  - '@nuxt/kit@4.6.3 || 4.6.4'
  - '@nuxt/nitro-server@4.6.3 || 4.6.4'
  - '@nuxt/schema@4.6.3 || 4.6.4'
  - '@nuxt/vite-builder@4.6.3 || 4.6.4'
